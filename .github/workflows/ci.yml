name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Verify downloaded modules
        run: go mod verify

      - name: Verify module files are tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Scan reachable Go code for known vulnerabilities
        env:
          GOTOOLCHAIN: go1.26.5
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Validate deployment assets
        run: ./deploy/test.sh

      - name: Validate and build the container
        run: |
          docker build --check .
          docker build --tag queueframe:ci .
